<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,Arial,sans-serif;font-size:15px}
h1,h2,h3,.dis{font-family:Orbitron,Michroma,"Arial Black",sans-serif;letter-spacing:.04em}
.bar{background:var(--blue);color:#fff;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--blue);z-index:11}
.bar .sp{flex:1}
button,select,input,textarea{font:inherit}
.btn{border:0;border-radius:8px;padding:8px 12px;background:rgba(255,255,255,.15);color:#fff;cursor:pointer;font-weight:600}
.btn.p{background:var(--lime);color:var(--deep)}.btn.d{background:var(--r)}.btn.off{opacity:.45;text-decoration:line-through}

.net{font-size:12px;padding:4px 9px;border-radius:99px;background:var(--g);color:#fff}.net.off{background:var(--r)}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;background:var(--deep)}
nav button{white-space:nowrap;border:1px solid #4a45c4;background:none;color:#fff;padding:8px 14px;border-radius:8px;cursor:pointer}
nav .on{background:#fff;color:var(--blue);font-weight:700}nav .add{border-style:dashed;color:var(--lime)}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px;font-weight:600;text-transform:uppercase}

.chip.r{background:var(--r)}.chip.o{background:var(--o)}.chip.g{background:var(--g)}
.ph{border:2px dashed var(--line);border-radius:10px;padding:30px;text-align:center;color:var(--mut)}

.pt.ok{border-color:var(--g)}.pt.nok{border-color:var(--r)}.pt.na{border-color:var(--mut)}
.sb{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}.sb button{flex:1;padding:10px;border-radius:8px;border:2px solid var(--line);background:none;color:var(--tx);cursor:pointer;font-weight:600}

.dt{font-size:12px;color:var(--mut)}.row{display:flex;gap:8px;align-items:center}.row input{flex:1}
.sig{border:2px dashed var(--blue);border-radius:10px;padding:12px}.sig.done{border-style:solid;background:#a6e00022}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--deep);color:#fff;padding:10px 16px;border-radius:10px;z-index:99;display:none}
#print{display:none}
@media print{body{background:#fff;color:#000}.bar,nav,main,#modal,.toast{display:none!important}#print{display:block}

.cover h1{font-size:34px;margin:30px 0 8px}.cover td{padding:4px 12px 4px 0;vertical-align:top}.cover td:first-child{color:var(--lime)}
.ps{page-break-inside:avoid;margin-bottom:18px}#print table.t{width:100%;border-collapse:collapse;font-size:12px}#print .t td,#print .t th{border:1px solid #999;padding:4px;text-align:left;vertical-align:top}
#print h2{color:var(--blue);border-bottom:3px solid var(--lime);padding-bottom:4px}.stage{border-color:#000}}

// offline handling
let sd=null;
document.addEventListener('pointerdown',e=>{const c=e.target.closest('.sc');if(!c)return;const b=c.getBoundingClientRect(),x=c.getContext('2d');sd={c,x,b};x.lineWidth=3;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#201a8e';x.beginPath();x.moveTo((e.clientX-b.left)*c.width/b.width,(e.clientY-b.top)*c.height/b.height);x.lineTo((e.clientX-b.left)*c.width/b.width+.1,(e.clientY-b.top)*c.height/b.height);x.stroke();c.dirty=1;e.preventDefault()});
document.addEventListener('pointermove',e=>{if(!sd)return;const{c,x,b}=sd;x.lineTo((e.clientX-b.left)*c.width/b.width,(e.clientY-b.top)*c.height/b.height);x.stroke()});
document.addEventListener('pointerup',()=>sd=null);
function net(){const o=navigator.onLine;$('#net').textContent=T(o?'ONLINE':'OFFLINE');$('#net').className='net'+(o?'':' off');$('#mail').classList.toggle('off',!o);$('#mail').title=o?'':T('Requires internet')}
$('#lang').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.lang=b.dataset.l;save();net();render()};
addEventListener('online',net);addEventListener('offline',net);net();
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'){zid=null;render()}});
render();
</script></body></html>
