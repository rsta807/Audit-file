<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MECH·I·TRONIC – Machine Audit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;600&display=swap">
<style>
:root{--blue:#201a8e;--deep:#120f5c;--lime:#a6e000;--tint:#f3f4fc;--bg:#eef0fb;--card:#fff;--tx:#1a1a3a;--mut:#6b6b95;--r:#e5383b;--o:#ff9f1c;--g:#22b24c;--line:color-mix(in srgb,var(--blue) 14%,#fff);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0b3a;--card:#17136e;--tx:#eef0ff;--mut:#a9a8e0;--line:#2f2aa0}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,Arial,sans-serif;font-size:15px}
h1,h2,h3,.dis{font-family:Orbitron,Michroma,"Arial Black",sans-serif;letter-spacing:.04em}
.bar{background:var(--blue);color:#fff;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--blue);z-index:11}
.bar .sp{flex:1}
button,select,input,textarea{font:inherit}
.btn{border:0;border-radius:8px;padding:8px 12px;background:rgba(255,255,255,.15);color:#fff;cursor:pointer;font-weight:600}
.btn.p{background:var(--lime);color:var(--deep)}.btn.d{background:var(--r)}.btn.off{opacity:.45;text-decoration:line-through}
.seg{display:flex;background:var(--deep);border-radius:10px;padding:3px}.seg button{border:0;background:none;color:#fff;padding:7px 14px;border-radius:8px;font-weight:600;cursor:pointer}.seg .on{background:var(--lime);color:var(--deep)}
.net{font-size:12px;padding:4px 9px;border-radius:99px;background:var(--g);color:#fff}.net.off{background:var(--r)}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;background:var(--deep)}
nav button{white-space:nowrap;border:1px solid color-mix(in srgb,#fff 28%,transparent);background:none;color:#fff;padding:8px 14px;border-radius:8px;cursor:pointer}
nav .on{background:#fff;color:var(--blue);font-weight:700}nav .add{border-style:dashed;color:var(--lime)}
main{max-width:1100px;margin:0 auto;padding:14px}
.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:14px;border-left:5px solid var(--lime);box-shadow:0 2px 8px #0001}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px;font-weight:600;text-transform:uppercase}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--tx)}
.kpi{display:flex;gap:10px;flex-wrap:wrap}.kpi div{flex:1;min-width:110px;background:var(--blue);color:#fff;border-radius:10px;padding:10px}.kpi b{display:block;font:700 22px Orbitron,Arial}
.kpi small{opacity:.8}.pb{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin:10px 0}.pb i{display:block;height:100%;background:var(--lime)}
.stage{position:relative;display:inline-block;max-width:100%;border-radius:10px;overflow:hidden;border:2px solid var(--blue);user-select:none;-webkit-user-select:none}
.stage img{display:block;max-width:100%;max-height:70vh;pointer-events:none}.stage.draw{cursor:crosshair;touch-action:none}
.z{position:absolute;border:3px solid;border-radius:6px;cursor:pointer;display:flex;align-items:flex-start;background:transparent;box-shadow:0 0 0 1px #fffc,inset 0 0 0 1px #0005}
.z span{font-size:12px;font-weight:700;padding:0 5px;color:currentColor;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 2px #000}
.z span b{color:#fff}.z.r{color:var(--r)}.z.o{color:var(--o)}.z.g{color:var(--g)}
.z span{mix-blend-mode:normal}.chip{display:inline-block;margin:3px;padding:6px 10px;border-radius:99px;color:#fff;font-size:13px;cursor:pointer;border:0}
.chip.r{background:var(--r)}.chip.o{background:var(--o)}.chip.g{background:var(--g)}
.ph{border:2px dashed var(--line);border-radius:10px;padding:30px;text-align:center;color:var(--mut)}
#modal{position:fixed;inset:0;background:#000a;z-index:50;display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}#mb{background:var(--bg);width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px}
.pt{background:var(--card);border-radius:10px;padding:10px;margin-bottom:10px;border-left:5px solid var(--line)}
.pt.ok{border-color:var(--g)}.pt.nok{border-color:var(--r)}.pt.na{border-color:var(--mut)}
.sb{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}.sb button{flex:1;padding:10px;border-radius:8px;border:2px solid var(--line);background:none;color:var(--tx);cursor:pointer;font-weight:600}
.sb .ok.on{background:var(--g);color:#fff;border-color:var(--g)}.sb .nok.on{background:var(--r);color:#fff;border-color:var(--r)}.sb .na.on{background:var(--mut);color:#fff}
.dt{font-size:12px;color:var(--mut)}.row{display:flex;gap:8px;align-items:center}.row input{flex:1}
.sig{border:2px dashed var(--blue);border-radius:10px;padding:12px}.sig.done{border-style:solid;background:var(--lime)22}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--deep);color:#fff;padding:10px 16px;border-radius:10px;z-index:99;display:none}
#print{display:none}
@media print{body{background:#fff;color:#000}.bar,nav,main,#modal,.toast{display:none!important}#print{display:block}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cover{background:var(--blue);color:#fff;min-height:96vh;padding:50px;page-break-after:always;display:flex;flex-direction:column;justify-content:space-between}
.cover h1{font-size:34px;margin:30px 0 8px}.cover td{padding:4px 12px 4px 0;vertical-align:top}.cover td:first-child{color:var(--lime)}
.ps{page-break-inside:avoid;margin-bottom:18px}#print table.t{width:100%;border-collapse:collapse;font-size:12px}#print .t td,#print .t th{border:1px solid #999;padding:4px;text-align:left;vertical-align:top}
#print h2{color:var(--blue);border-bottom:3px solid var(--lime);padding-bottom:4px}.stage{border-color:#000}}
/* ---- Paper checklist (blank form, filled by hand) ---- */
.pp-dlg label.ck{display:flex;gap:8px;align-items:center;text-transform:none;font-size:14px;color:var(--tx);font-weight:400;margin:10px 0}.pp-dlg label.ck input{width:auto}
#print.paper{font:9pt Inter,Arial,sans-serif;color:#1a1a3a}
#print.paper *{box-sizing:border-box}
.pp-page{break-after:page;page-break-after:always}.pp-page:last-child{break-after:auto;page-break-after:auto}
.pp-band{background:var(--blue);color:#fff;display:flex;align-items:center;gap:4mm;padding:2.5mm 4mm;border-radius:2mm;border-bottom:1.2mm solid var(--lime);break-inside:avoid;break-after:avoid}
.pp-band .ttl{flex:1;min-width:0}.pp-band h1{font:700 14pt Orbitron,Arial,sans-serif;letter-spacing:.04em;margin:0;line-height:1.15}
.pp-band small{font-size:7.5pt;opacity:.85;text-transform:uppercase;letter-spacing:.06em}
.pp-sn{font:700 20pt Orbitron,Arial,sans-serif;color:var(--lime);min-width:10mm;text-align:center}
.pp-meta{font-size:7.5pt;line-height:1.5;text-align:right;white-space:nowrap}.pp-meta b{font-size:8.5pt}
.pp-ph{text-align:center;margin:3mm 0 2.5mm;break-inside:avoid;break-after:avoid}
.pp-phs{display:grid;grid-template-columns:repeat(var(--c),minmax(0,1fr));gap:3mm;margin:3mm 0 2.5mm;align-items:end}.pp-pc{margin:0;text-align:center;break-inside:avoid}.pp-pc figcaption{font-size:7.3pt;font-weight:600;color:#6b6b95;margin-top:.8mm}
.pp-st{position:relative;display:inline-block;max-width:100%;border:.4mm solid var(--blue);border-radius:1.5mm;overflow:hidden;vertical-align:top}
.pp-st img{display:block;max-width:100%;width:auto}
.pp-z{position:absolute;border:.7mm solid var(--blue);border-radius:1mm;box-shadow:0 0 0 .35mm #fff,inset 0 0 0 .35mm #fff}
.pp-z b{position:absolute;top:0;left:0;background:var(--blue);color:#fff;font:700 8pt Inter,Arial,sans-serif;min-width:5mm;height:5mm;line-height:5mm;padding:0 1mm;text-align:center;border-radius:0 0 1.2mm 0}
table.pp-t{width:100%;border-collapse:collapse;table-layout:fixed;font-size:8.3pt}
.pp-t thead{display:table-header-group}.pp-t tbody{break-inside:avoid;page-break-inside:avoid}.pp-t tr{break-inside:avoid;page-break-inside:avoid}
.pp-t th{background:var(--blue);color:#fff;font-weight:600;font-size:7pt;text-transform:uppercase;letter-spacing:.03em;padding:1.4mm 1.5mm;text-align:left;border:.25mm solid var(--blue)}
.pp-t th.c,.pp-t td.c{text-align:center}
.pp-t td{border:.25mm solid #b9bce0;padding:.8mm 1.5mm;height:9mm;vertical-align:middle;line-height:1.25}
.pp-t td.zn{vertical-align:top;background:var(--tint);border-left:1mm solid var(--lime);padding-top:1.4mm}
.pp-num{display:inline-block;background:var(--blue);color:#fff;font-weight:700;border-radius:1mm;padding:0 1.3mm;margin-right:1.2mm}
.pp-zn{font-weight:700}
.pp-th{display:block;margin-top:1.4mm;max-width:100%;border-radius:1mm;border:.25mm solid #b9bce0}
.pp-pid{color:#6b6b95;font-size:7.3pt}
.cb{display:inline-block;width:4.3mm;height:4.3mm;border:.4mm solid #22b24c;border-radius:.7mm;background:#fff;vertical-align:middle}
.cb.nok{border-color:#e5383b}.cb.na{border-color:#8a8ab0}
tr.blank td{border-style:dashed}
.pp-obs{margin-top:3mm;border:.3mm solid #b9bce0;border-left:1mm solid var(--lime);border-radius:1.5mm;padding:1.5mm 3mm 2mm;break-inside:avoid}
.pp-obs .l{height:7mm;border-bottom:.25mm dotted #8a8ab0}
.pp-lbl{display:block;font-size:6.8pt;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#6b6b95;margin-bottom:.8mm}
.pp-f{display:grid;grid-template-columns:1fr 1fr;gap:3mm 8mm;margin:6mm 0 5mm}
.pp-f>div{border-bottom:.3mm solid var(--blue);min-height:11mm;padding-bottom:1mm}.pp-f>div span{display:block;font-size:10.5pt;min-height:5mm}
.pp-cvg{display:grid;grid-template-columns:1fr 1fr;gap:6mm;align-items:start}.pp-cvg.one{grid-template-columns:1fr}
.pp-mph img{display:block;max-width:100%;max-height:85mm;margin:0 auto;border-radius:1.5mm;border:.4mm solid var(--blue)}
.pp-leg{margin-top:5mm;background:var(--tint);border-left:1mm solid var(--lime);border-radius:1.5mm;padding:3mm 4mm;break-inside:avoid}
.pp-leg p{margin:1mm 0 2.5mm;line-height:1.4}.pp-leg span{display:inline-flex;align-items:center;gap:1.5mm;margin-right:7mm}
.pp-sg{display:grid;grid-template-columns:1fr 1fr;gap:6mm;margin-top:4mm;break-inside:avoid}
.pp-sg>div{border:.35mm solid var(--blue);border-radius:1.5mm;padding:2.5mm 3.5mm}.pp-sg h3{font:700 9pt Orbitron,Arial,sans-serif;color:var(--blue);margin:0 0 2mm}
.pp-sg .fl{border-bottom:.25mm solid #8a8ab0;height:8mm;margin-bottom:1.5mm}.pp-sg .sa{height:28mm;border:.25mm dashed #8a8ab0;border-radius:1mm}
.pp-z.r{border-color:#e5383b}.pp-z.r b,.pp-num.r{background:#e5383b}.pp-z.o{border-color:#ff9f1c}.pp-z.o b,.pp-num.o{background:#ff9f1c}.pp-z.g{border-color:#22b24c}.pp-z.g b,.pp-num.g{background:#22b24c}
.rp-s{display:inline-block;padding:.6mm 1.8mm;border-radius:3mm;font-weight:700;font-size:7pt;color:#fff;line-height:1.2}.rp-s.ok{background:#22b24c}.rp-s.nok{background:#e5383b}.rp-s.na{background:#8a8ab0}.rp-s.no{color:#8a8ab0;border:.3mm solid #b9bce0}
.rp tr.nok td:not(.zn){background:#fdeeee}.rp-pf{display:flex;flex-wrap:wrap;gap:1mm;margin-top:1mm}.rp-pf img{height:20mm;border-radius:1mm;border:.25mm solid #b9bce0}
.pp-stn.tight .pp-t td{height:7.5mm;padding-top:.5mm;padding-bottom:.5mm}.pp-stn.tight .pp-obs .l{height:6mm}.pp-sum td{height:8.5mm}.pp-sum tr.tot td{font-weight:700;background:var(--tint)}
.blg{display:inline-flex;align-items:center;background:#fff;box-shadow:0 1px 4px #0002}.blg img{display:block}
</style></head><body>

<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9),KEY='mit_audit_v1';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const L=[[`Design`,`Conception`,`Konstruktion`,`Progettazione`],[`⬇ Save JSON`,`⬇ Enregistrer JSON`,`⬇ JSON speichern`,`⬇ Salva JSON`],[`⬆ Load JSON`,`⬆ Charger JSON`,`⬆ JSON laden`,`⬆ Carica JSON`],[`✉ Email`,`✉ E-mail`,`✉ E-Mail`,`✉ Email`],[`ONLINE`,`EN LIGNE`,`ONLINE`,`ONLINE`],[`OFFLINE`,`HORS LIGNE`,`OFFLINE`,`OFFLINE`],[`Requires internet`,`Nécessite internet`,`Internet erforderlich`,`Richiede internet`],[`Machine info`,`Infos machine`,`Maschineninfo`,`Info macchina`],[`+ Station`,`+ Station`,`+ Station`,`+ Stazione`],[`Library`,`Bibliothèque`,`Bibliothek`,`Libreria`],[`Report & Sign`,`Rapport & signatures`,`Bericht & Unterschrift`,`Rapporto e firme`],[`Audit header`,`En-tête d'audit`,`Audit-Kopfdaten`,`Intestazione audit`],[`Author (MIT)`,`Rédacteur (MIT)`,`Verfasser (MIT)`,`Redattore (MIT)`],[`Subsidiary`,`Filiale`,`Tochtergesellschaft`,`Filiale`],[`Beneficiary (Client)`,`Bénéficiaire (Client)`,`Begünstigter (Kunde)`,`Beneficiario (Cliente)`],[`Beneficiary location`,`Localisation du bénéficiaire`,`Standort des Begünstigten`,`Sede del beneficiario`],[`Job number`,`N° d'affaire`,`Auftragsnummer`,`N. commessa`],[`Machine number`,`N° de machine`,`Maschinennummer`,`N. macchina`],[`Machine name`,`Nom de la machine`,`Maschinenname`,`Nome macchina`],[`Audit start date`,`Date de début de l'audit`,`Audit-Startdatum`,`Data inizio audit`],[`Audit end date`,`Date de fin de l'audit`,`Audit-Enddatum`,`Data fine audit`],[`MIT contact`,`Contact MIT`,`MIT-Kontakt`,`Contatto MIT`],[`MIT phone number`,`Téléphone MIT`,`MIT-Telefonnummer`,`Telefono MIT`],[`Overall machine photo`,`Photo globale de la machine`,`Gesamtfoto der Maschine`,`Foto generale della macchina`],[`No photo`,`Aucune photo`,`Kein Foto`,`Nessuna foto`],[`Replace photo`,`Remplacer la photo`,`Foto ersetzen`,`Sostituisci foto`],[`Add photo`,`Ajouter une photo`,`Foto hinzufügen`,`Aggiungi foto`],[`Remove`,`Supprimer`,`Entfernen`,`Rimuovi`],[`Delete`,`Supprimer`,`Löschen`,`Elimina`],[`Add a station photo, then drag o document.addEventListener('pointerdown',e=>{const c=e.target.closest('.sc');if(!c)return;const b=c.getBoundingClientRect(),x=c.getContext('2d');sd={c,x,b};x.lineWidth=3;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#201a8e';x.beginPath();x.moveTo((e.clientX-b.left)*c.width/b.width,(e.clientY-b.top)*c.height/b.height);x.lineTo((e.clientX-b.left)*c.width/b.width+.1,(e.clientY-b.top)*c.height/b.height);x.stroke();c.dirty=1;e.preventDefault()});
document.addEventListener('pointermove',e=>{if(!sd)return;const{c,x,b}=sd;x.lineTo((e.clientX-b.left)*c.width/b.width,(e.clientY-b.top)*c.height/b.height);x.stroke()});
document.addEventListener('pointerup',()=>sd=null);
function net(){const o=navigator.onLine;$('#net').textContent=T(o?'ONLINE':'OFFLINE');$('#net').className='net'+(o?'':' off');$('#mail').classList.toggle('off',!o);$('#mail').title=o?'':T('Requires internet')}
$('#lang').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.lang=b.dataset.l;save();net();render()};
addEventListener('online',net);addEventListener('offline',net);net();
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'){zid=null;render()}});
render();
</script></body></html>
